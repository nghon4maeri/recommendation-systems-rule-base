# filepath: airflow/docker-compose-airflow.yml
version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1-python3.11
  environment:
    - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    - AIRFLOW__CORE__LOAD_EXAMPLES=false
    - AIRFLOW__CORE__ENABLE_XCOM_PICKLING=true
    - AIRFLOW__WEBSERVER__SECRET_KEY=recsys_airflow_secret_key_production_2026
    - AIRFLOW__LOGGING__LOGGING_LEVEL=INFO
    - PYTHONPATH=/opt/airflow:/opt/airflow/dags
    - REDIS_HOST=redis
    - REDIS_PORT=6379
  volumes:
    - ./dags:/opt/airflow/dags
    - ../data:/opt/airflow/data
    - ../mlops:/opt/airflow/mlops
    - ../backend:/opt/airflow/backend
    - ../data_pipeline:/opt/airflow/data_pipeline
    - ../streaming:/opt/airflow/streaming
    - ../dbt_project:/opt/airflow/dbt_project
    - ./logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - recsys_airflow_net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db upgrade
        airflow users create \
          --username admin \
          --firstname Data \
          --lastname Platform \
          --role Admin \
          --email admin@recsys.local \
          --password admin || true
    networks:
      - recsys_airflow_net

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - recsys_airflow_net

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - recsys_airflow_net

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - recsys_airflow_net

volumes:
  airflow_postgres_data:
    driver: local

networks:
  recsys_airflow_net:
    driver: bridge
