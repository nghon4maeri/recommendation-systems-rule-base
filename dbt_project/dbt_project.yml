# filepath: dbt_project/dbt_project.yml
# ==============================================================================
# dbt Project Configuration: Lakehouse ELT for Hybrid Recommender Platform
# ==============================================================================

name: 'dbt_project'
version: '2.0.0'
config-version: 2

# Profile defined in profiles.yml or ~/.dbt/profiles.yml
profile: 'dbt_project'

# Directory configuration
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Clean targets
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

# Model Configurations
models:
  dbt_project:
    staging:
      +materialized: view
      +schema: staging
      +tags: ["staging", "daily_elt"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["gold_marts", "ml_features"]
      transaction_fpgrowth:
        +materialized: table
        +tags: ["fpgrowth", "market_basket"]
      user_item_dl:
        +materialized: table
        +tags: ["ncf", "deep_learning", "embeddings"]

# Seeds configuration
seeds:
  dbt_project:
    +schema: raw_seeds
