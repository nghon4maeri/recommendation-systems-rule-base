# filepath: dbt_project/models/schema.yml
version: 2

sources:
  - name: public
    description: "Raw transactional tables ingested into Lakehouse PostgreSQL / MinIO"
    tables:
      - name: online_retail
        description: "Raw Kaggle Online Retail II transactional table"
        columns:
          - name: InvoiceNo
            description: "Invoice identifier string (starts with 'C' if cancellation)"
          - name: StockCode
            description: "Product item code"
          - name: Description
            description: "Product description"
          - name: Quantity
            description: "Quantity purchased"
          - name: InvoiceDate
            description: "Timestamp of purchase"
          - name: UnitPrice
            description: "Price per unit in GBP"
          - name: CustomerID
            description: "Unique Customer identifier integer"
          - name: Country
            description: "Country of purchaser"

models:
  - name: stg_online_retail
    description: "Cleaned and standardized online retail transactions without cancellations."
    columns:
      - name: invoiceno
        description: "Standardized invoice identifier"
        tests:
          - not_null
      - name: stockcode
        description: "Standardized stock identifier code"
        tests:
          - not_null
      - name: description
        description: "Cleaned uppercase product description"
        tests:
          - not_null
      - name: quantity
        description: "Positive integer quantity of items"
        tests:
          - not_null
      - name: unitprice
        description: "Unit price in GBP"
        tests:
          - not_null
      - name: line_amount
        description: "Total line amount (quantity * unitprice)"
        tests:
          - not_null

  - name: transaction_fpgrowth
    description: "Aggregated multi-item shopping baskets curated for FP-Growth market basket mining."
    columns:
      - name: transaction_id
        description: "Invoice / Transaction identifier"
        tests:
          - not_null
          - unique
      - name: basket_size
        description: "Count of distinct items in basket (strictly >= 2 for association rules)"
        tests:
          - not_null
      - name: total_basket_value
        description: "Monetary total of the shopping basket"
        tests:
          - not_null
      - name: items
        description: "Comma-delimited string of item descriptions"
        tests:
          - not_null

  - name: user_item_dl
    description: "Feature-engineered implicit interaction pairs for Neural Collaborative Filtering."
    columns:
      - name: user_id
        description: "Customer / User identifier integer"
        tests:
          - not_null
      - name: item_id
        description: "StockCode item identifier"
        tests:
          - not_null
      - name: interaction_frequency
        description: "Distinct transaction dates customer interacted with item"
        tests:
          - not_null
      - name: implicit_rating
        description: "Log-normalized spend rating score ln(1 + spend)"
        tests:
          - not_null
