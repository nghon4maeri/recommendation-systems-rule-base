# filepath: docker/docker-compose.yml
# ==============================================================================
# Standalone Docker Compose: Serving Layer & Feature Store
# ==============================================================================
version: "3.9"

services:
  # ----------------------------------------------------
  # 1. Relational Metadata Store (PostgreSQL)
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: rs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123password}
      POSTGRES_DB: ${POSTGRES_DB:-fp_growth_mba}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./db/initdb.d:/docker-entrypoint-initdb.d:ro
      - ../data:/data:ro
      - postgres_cluster_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fp_growth_mba}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recsys_net

  # ----------------------------------------------------
  # 2. In-Memory Feature Store & Session Cache (Redis)
  # ----------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: rs_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_feature_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - recsys_net

  # ----------------------------------------------------
  # 3. FastAPI Serving Gateway Microservice
  # ----------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    image: rs_fpgrowth-backend:latest
    container_name: rs_backend-container
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-abc123password}@db:5432/${POSTGRES_DB:-fp_growth_mba}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATA_PATH: /app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ../backend:/app/backend
      - ../data:/app/data
      - ../models:/app/models
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - recsys_net

  # ----------------------------------------------------
  # 4. Streamlit Interactive Dashboard UI
  # ----------------------------------------------------
  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: rs_fpgrowth-ui:latest
    container_name: rs_ui-container
    restart: unless-stopped
    environment:
      API_URL: http://backend:8000
      DATA_PATH: /app/data
    ports:
      - "${UI_PORT:-8501}:8501"
    volumes:
      - ../ui:/app/ui
      - ../data:/app/data
    depends_on:
      - backend
    command: >
      sh -c "streamlit run ui/streamlit_app.py --server.port=8501 --server.address=0.0.0.0"
    networks:
      - recsys_net

networks:
  recsys_net:
    driver: bridge

volumes:
  postgres_cluster_data:
  redis_feature_data:
