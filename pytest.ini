[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers
testpaths =
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: marks unit tests
    integration: marks integration tests requiring mock services
    api: marks FastAPI serving gateway endpoint tests
    ml: marks MLOps model validation and inference tests
    streaming: marks Kafka and session consumer tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
